<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" shape-rendering="crispEdges" role="img" aria-label="Pixel art Python developer desk with animated code, charts and a snake" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.mono{font-family:Consolas,Menlo,'Courier New',monospace}
.tw{animation:tw 2.4s steps(2,end) infinite}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.15}}
.bob{animation:bob 1s steps(2,end) infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.type{animation:type 1.1s steps(2,end) infinite}
@keyframes type{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
.steam{animation:steam 2.4s linear infinite;opacity:0}
@keyframes steam{0%{transform:translateY(0);opacity:0}30%{opacity:.8}100%{transform:translateY(-26px);opacity:0}}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 4.5s ease-in-out infinite}
@keyframes grow{0%{transform:scaleY(.08)}35%,80%{transform:scaleY(1)}100%{transform:scaleY(.08)}}
.ln{transform-box:fill-box;transform-origin:0 50%;animation:ln 6s steps(10,end) infinite}
@keyframes ln{0%{transform:scaleX(0)}35%,88%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.blink{animation:bl 1s steps(1,end) infinite}
@keyframes bl{50%{opacity:0}}
.seg{animation:wave 1.4s steps(4,end) infinite}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.rise{animation:rise 6s linear infinite;opacity:0;font-size:20px;font-weight:700}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:.8}100%{transform:translateY(-70px);opacity:0}}
.node{animation:node 2s steps(2,end) infinite}
@keyframes node{0%,100%{opacity:.35}50%{opacity:1}}
.trend{stroke-dasharray:100;animation:trend 4.5s linear infinite}
@keyframes trend{0%{stroke-dashoffset:100}45%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:100}}
.glow{animation:glow 3s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.5}50%{opacity:.9}}
</style>

<!-- room -->
<rect width="800" height="420" fill="#0e1330"/>
