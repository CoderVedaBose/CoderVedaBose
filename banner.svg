<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Bedanto Bose - Python Developer and Data Science Enthusiast" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.fl{animation:float 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}
.rise{animation:rise 8s linear infinite;opacity:0;font-family:Consolas,Menlo,monospace;font-size:13px;fill:#7dd3fc}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.45}85%{opacity:.35}100%{transform:translateY(-230px);opacity:0}}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.pulse{animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.mono{font-family:Consolas,Menlo,'Courier New',monospace}
.draw{stroke-dasharray:1000;animation:draw 5s linear infinite}
@keyframes draw{0%{stroke-dashoffset:1000}80%,100%{stroke-dashoffset:0}}
</style>
<defs>
